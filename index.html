<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
</head>
<body>

<h1 align="center">Student Registration Form</h1>
<hr>

<form id="regForm" action="submit.html" method="post">

    <!-- Full Name -->
    <p>
        <label for="fullname">Full Name: </label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
    </p>

    <!-- Email (validated by type="email") -->
    <p>
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" placeholder="Enter valid email address" required>
    </p>

    <!-- Password -->
    <p>
        <label for="password">Password: </label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
    </p>

    <!-- Gender (Radio buttons) -->
    <p>
        <label>Gender: </label>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
    </p>

    <!-- Course (Dropdown) -->
    <p>
        <label for="course">Course: </label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="BTech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="BBA">BBA</option>
            <option value="MBA">MBA</option>
        </select>
    </p>

    <!-- Contact Number -->
    <p>
        <label for="contact">Contact No: </label>
        <input type="tel" id="contact" name="contact" placeholder="Enter phone number" required>
    </p>

    <!-- Address (Textarea) -->
    <p>
        <label for="address">Address: </label><br>
        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea>
    </p>

    <!-- Submit and Reset -->
    <p>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </p>
</form>

<hr>
<p align="center">&copy; 2025 Student Registration Portal</p>

<script>
    // GitHub Pages / Live Server cannot receive POST requests, so after the browser
    // finishes its own validation (required fields + email format), go to submit.html.
    document.getElementById("regForm").addEventListener("submit", function (event) {
        event.preventDefault();
        window.location.href = "submit.html";
    });
</script>

</body>
</html>
